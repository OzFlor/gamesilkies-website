  <style>
    :root {
      color-scheme: light;
      --ink: #25332b;
      --muted: #647168;
      --paper: #f7f7f1;
      --panel: #ffffff;
      --green: #405b49;
      --line: #dce2d9;
      --soft: #eaf0e9;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 16px/1.65 system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    a {
      color: var(--green);
      text-underline-offset: 3px;
    }

    a:hover {
      text-decoration-thickness: 2px;
    }

    .wrap {
      width: min(960px, calc(100% - 40px));
      margin: 0 auto;
    }

    header {
      padding: 64px 0 48px;
      background: #e9eee7;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--green);
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.7rem, 8vw, 5rem);
      line-height: 1.04;
      font-weight: 500;
      letter-spacing: -.04em;
    }

    .tagline {
      max-width: 680px;
      margin: 18px 0 0;
      color: #4e5d52;
      font-size: clamp(1.08rem, 2.5vw, 1.35rem);
    }

    nav {
      padding: 14px 0;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }

    nav .wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 22px;
    }

    nav a {
      font-size: .9rem;
      font-weight: 600;
      text-decoration: none;
    }

    main {
      padding: 42px 0 64px;
    }

    section {
      margin: 0 0 38px;
    }

    h2 {
      margin: 0 0 12px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.65rem;
      font-weight: 500;
    }

    p {
      margin: 0 0 14px;
    }

    .notice {
      padding: 18px 20px;
      margin: 0 0 16px;
      background: var(--soft);
      border-left: 4px solid var(--green);
      border-radius: 4px;
    }

    .notice + .notice {
      margin-bottom: 38px;
    }

    .notice strong {
      display: block;
      margin-bottom: 4px;
    }

    .notice p:last-child {
      margin-bottom: 0;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }
