<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem-vindo | Página Inicial</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eaeaea;
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }
        .lang-switch {
            text-decoration: none;
            color: #0066cc;
            font-weight: 500;
            padding: 0.4rem 0.8rem;
            border: 1px solid #0066cc;
            border-radius: 4px;
            transition: background-color 0.2s, color 0.2s;
        }
        .lang-switch:hover {
            background-color: #0066cc;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <header>
        <h1>O Meu Sítio Web</h1>
        <nav aria-label="Seleção de idioma">
            <a href="index.html" hreflang="en" lang="en" class="lang-switch">English</a>
        </nav>
    </header>

    <main>
        <h2>Bem-vindo!</h2>
        <p>Esta é a versão em português de Portugal desta página. Pode adicionar aqui o seu conteúdo principal, imagens ou hiperligações.</p>
    </main>

    <footer>
        <p><small>&copy; 2026 Todos os direitos reservados.</small></p>
    </footer>

</body>
</html>
